<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnimaStudio - 2D/3D Web Animator</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <div id="auth-screen" class="screen">
    <div class="auth-card">
      <h1>AnimaStudio 🎬</h1>
      <p>Easy 2D & 3D Animation Suite</p>
      
      <div class="tabs">
        <button id="btn-tab-personal" class="tab-btn active" onclick="switchAuthTab('student')">Student / Worker Login</button>
        <button id="btn-tab-admin" class="tab-btn" onclick="switchAuthTab('admin')">School Admin</button>
      </div>

      <div id="tab-student" class="auth-tab">
        <input type="email" id="login-email" placeholder="School/Worker Email">
        <input type="password" id="login-pass" placeholder="Password">
        <button onclick="loginWithEmail()" class="primary-btn" style="width:100%; margin-top:5px;">Log In</button>
        
        <hr style="margin:15px 0; border-color:#3b3e54;">
        
        <button id="google-login-btn" onclick="loginGoogle()" class="secondary-btn google-btn">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" width="18">
          Sign in with Google
        </button>
      </div>

      <div id="tab-admin" class="auth-tab hidden">
        <h3>Organization Setup</h3>
        <input type="text" id="supabase-url" placeholder="Supabase Project URL">
        <input type="password" id="supabase-key" placeholder="Supabase Anon Key">
        <button onclick="connectSupabase()" class="secondary-btn" style="width:100%; margin-top:10px;">Connect Backend</button>
      </div>
    </div>
  </div>

  <div id="app-screen" class="screen hidden">
    <header class="navbar">
      <div class="nav-left">
        <h2>AnimaStudio</h2>
        <span id="user-badge" class="badge">Guest</span>
      </div>
      <div class="nav-center">
        <button class="mode-btn active" id="mode-2d-btn" onclick="setDimensionMode('2d')">2D Canvas</button>
        <button class="mode-btn" id="mode-3d-btn" onclick="setDimensionMode('3d')">3D Scene</button>
      </div>
      <div class="nav-right">
        <button onclick="saveProjectCloud()" class="primary-btn" style="background:#2ed573; color:#111;">💾 Save Project</button>
        <button onclick="loadProjectsCloud()" class="secondary-btn">📂 Open Saved</button>
        <button onclick="toggleAdminPanel()" id="admin-panel-toggle" class="hidden">School Admin</button>
        <button onclick="logout()" class="danger-btn" style="background:#ff4757; color:#fff;">Log Out</button>
      </div>
    </header>

    <main class="workspace">
      <aside class="sidebar">
        <h3>2D Objects</h3>
        <div id="controls-2d">
          <button onclick="add2DShape('rectangle')" class="tool-btn">➕ Rectangle</button>
          <button onclick="add2DShape('circle')" class="tool-btn">➕ Circle</button>
          <button onclick="add2DShape('star')" class="tool-btn">⭐ Star</button>
          <button onclick="add2DShape('text')" class="tool-btn">🔤 Text</button>
        </div>

        <div id="controls-3d" class="hidden">
          <h3>3D Objects</h3>
          <button onclick="add3DObject('cube')" class="tool-btn">🧊 Cube</button>
          <button onclick="add3DObject('sphere')" class="tool-btn">🔮 Sphere</button>
          <button onclick="add3DObject('cylinder')" class="tool-btn">🛢️ Cylinder</button>
          <button onclick="add3DObject('torus')" class="tool-btn">🍩 Donut (Torus)</button>
          <button onclick="add3DObject('pyramid')" class="tool-btn">🔺 Pyramid</button>
        </div>

        <hr style="margin: 15px 0; border-color: #3b3e54;">
        <h3>Position Controls</h3>
        <label>X: <input type="number" id="prop-x" value="200" oninput="updateObjectPosition()"></label>
        <label>Y: <input type="number" id="prop-y" value="150" oninput="updateObjectPosition()"></label>
        <label id="lbl-z" class="hidden">Z: <input type="number" id="prop-z" value="0" oninput="updateObjectPosition()"></label>
      </aside>

      <div class="viewport-container">
        <canvas id="canvas-2d"></canvas>
        <div id="canvas-3d-container" class="hidden"></div>
      </div>
    </main>

    <footer class="timeline-bar">
      <div class="timeline-controls">
        <button id="play-btn" onclick="togglePlayback()" class="primary-btn">▶ Play</button>
        <button onclick="addKeyframe()" class="secondary-btn">🔑 Set Keyframe</button>
        <span id="frame-counter">Frame: 0 / 60</span>
      </div>
      <div class="timeline-track-container" id="timeline-track"></div>
    </footer>
  </div>

  <div id="admin-modal" class="modal hidden">
    <div class="modal-content">
      <span class="close-btn" onclick="toggleAdminPanel()">&times;</span>
      <h2>School / Business Account Manager</h2>
      <p style="color:#aaa; font-size:14px; margin-bottom:15px;">Create accounts or bulk import students.</p>

      <div class="admin-section">
        <h3>Option 1: Add Single Account</h3>
        <div class="form-grid">
          <input type="text" id="single-name" placeholder="Full Name">
          <input type="email" id="single-email" placeholder="Email Address">
          <input type="password" id="single-pass" placeholder="Custom Password (Optional)">
          <button onclick="createSingleUser()" class="primary-btn" style="margin-top:5px;">Create User</button>
        </div>
      </div>

      <div class="admin-section">
        <h3>Option 2: Bulk Import (.txt or Paste)</h3>
        <textarea id="bulk-text-input" rows="4" placeholder="Format per line: email, name, custom_password&#10;Example: alex@school.edu, Alex Smith, Pass123!"></textarea>

        <div class="bulk-options">
          <label style="display:block; margin-top:5px;">Import File: <input type="file" id="file-import" accept=".txt,.csv" onchange="handleFileUpload(event)"></label>
          <label style="display:block; margin-top:5px;">Password Strategy:
            <select id="password-strategy" onchange="toggleGlobalPasswordInput()">
              <option value="default">Default Password (password123)</option>
              <option value="global">Custom Password for ALL Users</option>
              <option value="custom">Use Password from Input/File</option>
            </select>
          </label>
          <input type="password" id="global-password" class="hidden" placeholder="Enter Global Password">
          <button onclick="processBulkImport()" class="primary-btn" style="width:100%; margin-top:10px;">Batch Create Accounts</button>
        </div>
      </div>
      <div id="admin-status-msg" style="margin-top:15px; font-weight:bold;"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
